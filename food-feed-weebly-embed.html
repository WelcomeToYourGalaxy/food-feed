<div class="fd">

    <header class="fd-head">
        <h1 class="fd-title"><span class="fd-dot idle" id="fdDot"></span> Food and <em>drink</em></h1>
        <p class="fd-lede">
            <strong>The food and drink industries worldwide, in 26 languages: who owns the food system, who
            funds what is said about it, what it does to the people eating it and the land it runs on, and
            what the label actually certifies.</strong>
            Every row shows the source's standing and what the story carries — a ruling, official data, a
            measured figure, a pending decision.
        </p>
    </header>

    <section class="fd-panel">
        <div class="fd-bar">
            <p class="fd-status" id="fdStatus">Loading the wire…</p>
            <div class="fd-tools">
                <input class="fd-search" id="fdSearch" type="search" placeholder="ultra-processed, organic, residue, sugar tax…" aria-label="Filter headlines">
                <button class="fd-btn" id="fdClear">Clear</button>
                <button class="fd-btn" id="fdRefresh">Refresh</button>
            </div>
        </div>
        <div class="fd-progress"><div class="fd-progress-fill" id="fdProgress"></div></div>

        <div class="fd-filters">
            <div class="fd-row" id="fdTopicRow"><span class="fd-key">Subject</span></div>
            <div class="fd-row" id="fdGeoRow"><span class="fd-key">Region</span></div>
            <div class="fd-row" id="fdSubRow" style="display:none;"><span class="fd-key">Within</span></div>
            <div class="fd-row" id="fdPlaceRow" style="display:none;"><span class="fd-key">Place</span></div>
            <div class="fd-row" id="fdRegionRow"><span class="fd-key">Who reports it</span></div>
            <div class="fd-row" id="fdEvidenceRow"><span class="fd-key">Weight</span></div>
            <div class="fd-row" id="fdLangRow"><span class="fd-key">Language</span><span class="fd-tr"><label for="fdTr" class="fd-trlabel">Translate to</label><select id="fdTr" aria-label="Translate the feed"></select></span></div>
            <div class="fd-row" id="fdWhenRow"><span class="fd-key">Window</span></div>
        </div>
        <div class="fd-body">
            <div class="fd-list" id="fdList"><div class="fd-state">Loading the wire…</div></div>
            <div class="fd-map-wrap" id="fdMapWrap">
                <div class="fd-map" id="fdMap"></div>
                <div class="fd-map-note"><span id="fdMapCount">—</span><span id="fdMapUnplaced"></span></div>
            </div>
        </div>
    </section>

    <div class="fd-sheet" id="fdSheetAbout" role="dialog" aria-label="How this feed works">
        <button class="fd-sheet-close" data-close aria-label="Close">×</button>
        <p class="fd-note">
            <strong>What this is.</strong> A feed on the food and drink industries worldwide, in twenty-two
            subjects. Who owns the food system. Ultra-processed food and the conditions that track it. Nutrition
            science bought, and the narrative it produces. The health and nutrition bodies taking industry money —
            sometimes, as the section notes, up to 40 per cent of their funding. Front groups and manufactured
            doubt. Lobbying against bills, labels and taxes. Executives seated on the boards that decide, including
            on what food assistance may be spent. Who the marketing is aimed at. What a lawsuit costs against what
            the practice earns. Sugar and drink taxes. Then livestock and climate, the scale of slaughter, food
            waste, the bans on lab-grown meat, the narrowness of what is actually grown, water, dependency, and the
            alternatives. Nothing here is written or summarised: headlines and snippets are the publishers' own,
            every row links to the original, and no model touches the text.
        </p>
        <p class="fd-note">
            <strong>Organic gets two subjects, because the section takes it apart at length.</strong>
            <em>What the organic label certifies</em> follows the certification itself — that it rests on
            paperwork rather than testing, that certifying agents each cover hundreds of operations, that only a
            small share are tested annually, that a certifier is paid out of the crop it approves, and that
            hundreds of operations lose certification every year anyway. <em>Pesticide residues and testing</em>
            follows what is actually found: residues in certified produce, residue limits, and the monitoring
            programmes meant to catch them. The section's own figures — 21 per cent of samples in one study, 55
            per cent in another — sit across both.
        </p>
        <p class="fd-note">
            <strong>What it is not.</strong> The food pages are not this subject, and they are most food
            coverage: recipes, restaurant reviews, taste tests, menu launches, food festivals, diet plans, where
            to eat. All refused. So is business-page coverage with no influence or health angle — product
            launches, store openings, rebrands — and market-research copy, which pairs any subject word with a
            growth figure and says nothing about either. Food safety is refused too, which is a change: product
            recalls and foodborne-illness outbreaks are a real subject, but not the one the section describes,
            and while they were kept they were the largest thing on the wire. What this wire keeps is who owns
            it, who funds what is said about it, what it does to people and to the land it runs on, and what the
            label certifies. A story no subject will claim is refused rather than filed under a name it did not
            earn.
        </p>
        <p class="fd-note">
            <strong>Standing.</strong> Every wire is labelled by what kind of source it is, and every row carries
            the label. <em>Food agencies, regulators &amp; UN bodies</em> is the bodies that set standards and
            enforce them — the FAO and WHO, food safety agencies, courts, the OECD and the World Bank.
            <em>Research &amp; food system monitoring</em> is the research and the investigations, including the
            work on ownership and on industry-funded science. <em>Food, health &amp; animal organisations</em> is
            those arguing with all of it, on land, diet, marketing and animals. <em>Press</em> is general news
            across 26 languages. Standing is provenance, not a claim that a story is important.
        </p>
        <p class="fd-note">
            <strong>Weight.</strong> Separately, each story is scored on what it carries: a decision — a ruling, a
            law enacted, a tax introduced or repealed, a fine, a recall, a decertification, a ban (2);
            institutional material — an FAO or WHO report, a food agency finding, a residue monitoring programme,
            a peer-reviewed study or systematic review (2); a measured figure such as a prevalence rate, a residue
            level or a market share (1); a pending decision with a date attached (1); a named jurisdiction (1);
            and a primary source (1). At three or more the row is marked consequential.
        </p>
        <p class="fd-note">
            <strong>What is refused.</strong> The food pages, business coverage with no influence or health
            angle, sponsored content and market copy. The status line reports how many stories each harvest
            refused.
        </p>
        <p class="fd-note">
            <strong>Translation.</strong> The <em>Translate</em> control at the top renders the headlines and
            snippets on screen into any of 26 languages, through a free public translation endpoint — no account,
            no key, nothing stored. A translated row is marked as machine translation and keeps the publisher's
            original wording on hover, because a machine rendering is not the publisher's words. If the endpoint
            is unavailable the row simply stays in its original language rather than emptying. Translation
            applies to what is on screen; scroll further or widen a filter and press the control again.
        </p>
        <p class="fd-note">
            <strong>Region.</strong> Placement runs three levels deep. Pick a region and a second row opens with
            its subregions; pick one of those and a third row lists the places inside it — Latin America to the
            Amazon Basin to the Brazilian Amazon, Oceania to Australia to the Northern Territory. Each row counts
            what it holds, so an empty subregion is visible rather than hidden, and every story files under the
            subregion and region above whatever place it names.
        </p>
        <p class="fd-note">
            <strong>Limits worth knowing.</strong> The gate is mechanical: it reads words, not meaning. Standing
            is assigned per wire rather than per article. Google News caps a query at roughly 100 results over
            about 30 days. Coverage is uneven by language and the counts show it rather than hiding it.
        </p>
    </div>

    <div class="fd-sheet" id="fdSheetSources" role="dialog" aria-label="Sources and coverage">
        <button class="fd-sheet-close" data-close aria-label="Close">×</button>
        <p class="fd-note">
            Every wire read on the last harvest, with its standing: what it returned, and how many of its
            stories were refused. A wire that could not be reached says so rather than disappearing.
        </p>
        <div class="fd-src-grid" id="fdSrcGrid"></div>
    </div>

    <footer class="fd-foot">
        <span>Harvested every two hours from the FAO and WHO, food safety agencies and regulators, food system research and nutrition science, land, health and animal organisations, regional editions in 26 languages, and dedicated subject searches. Headlines belong to their publishers.</span>
        <span class="fd-foot-tools">
            <button class="fd-tab" data-sheet="fdSheetAbout">How this works</button>
            <button class="fd-tab" data-sheet="fdSheetSources">Sources &amp; coverage</button>
        </span>
    </footer>
</div>

<script>
(function () {
'use strict';

const REPO = 'WelcomeToYourGalaxy/food-feed';
const BRANCH = 'main';
const ENDPOINTS = [
    () => 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/wire_food.json?t=' + Date.now(),
    // jsDelivr caches @main for hours. Without a buster it will happily serve
    // a wire from before the first harvest, and an empty wire parses fine —
    // which is how this page once showed "0 stories" while 734 sat on main.
    () => 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + BRANCH + '/wire_food.json?t=' + Date.now()
];

// A selected chip prints #131311 on the topic colour, so every value here is
// held above 5.6:1 against that text. Ownership and what it does to a body sit
// in clay and rose, the influence machinery in mauve and violet, certification
// and testing in slate, and the land, the animals and the alternatives in teal
// and moss.
const TOPIC_COLOR = {
    ownership: '#b3877e',      // clay
    ultraprocessed: '#bc9699', // dusty rose
    science: '#c0a3ac',        // pale rose
    organisations: '#bf8b87',  // warm clay
    frontgroups: '#ba7c87',    // deep rose
    lobbying: '#ba8ea1',       // muted rose
    boards: '#bd9db2',         // pale mauve
    targeting: '#b284ad',      // mauve
    liability: '#b696ba',      // soft mauve
    taxes: '#b6a4c1',          // pale violet
    organic: '#8097b7',        // slate blue
    residues: '#89a5b7',       // dusty blue
    imports: '#a3aac3',        // pale slate
    livestock: '#699aa7',      // weathered teal
    slaughter: '#96b4b4',      // pale teal
    waste: '#76a398',          // teal moss
    labgrown: '#8cad9e',       // sage teal
    diversity: '#719e7f',      // moss
    water: '#96b296',          // pale moss
    dependency: '#94a888',     // deep moss
    alternatives: '#8da780'    // sage
};
const STANDING_COLOR = {
    official: '#93a3c0', research: '#a8b79a', press: '#a49f98',
    rights: '#86a5a5'
};
const WINDOWS = [
    { id: 'd1', label: '24 hours', ms: 864e5 },
    { id: 'd7', label: '7 days', ms: 7 * 864e5 },
    { id: 'd30', label: '30 days', ms: 30 * 864e5 },
    // the wire keeps 45 days, so anything past a month is reachable on its own
    { id: 'older', label: 'Older than 30 days', ms: 30 * 864e5, older: true },
    { id: 'all', label: 'Everything', ms: null }
];

const EVIDENCE = [
    { id: 'all', label: 'Any' },
    { id: 'doc', label: 'Consequential only' }
];

/* ============================================================
   Translation. Two independent things, because one of them can
   fail and the other cannot:

   1. In-place machine translation of the headlines and snippets
      you are looking at, through a free public endpoint. No key,
      no account. If it is unavailable the row falls back to the
      original text and says so rather than showing nothing.
   2. A per-row link that opens the article itself translated,
      which is a plain URL and works even when (1) does not.

   Machine translation is never presented as the publisher's own
   words: a translated row is marked, and the original title is
   kept on hover.
   ============================================================ */
const TR_LANGS = [
    ['off', 'Off — original'], ['en', 'English'], ['es', 'Español'], ['pt', 'Português'],
    ['fr', 'Français'], ['de', 'Deutsch'], ['it', 'Italiano'], ['nl', 'Nederlands'],
    ['sv', 'Svenska'], ['pl', 'Polski'], ['el', 'Ελληνικά'], ['ru', 'Русский'],
    ['uk', 'Українська'], ['tr', 'Türkçe'], ['ar', 'العربية'], ['he', 'עברית'],
    ['fa', 'فارسی'], ['hi', 'हिन्दी'], ['bn', 'বাংলা'], ['id', 'Bahasa Indonesia'],
    ['vi', 'Tiếng Việt'], ['th', 'ไทย'], ['ja', '日本語'], ['zh-CN', '简体中文'],
    ['zh-TW', '繁體中文'], ['ko', '한국어'], ['sw', 'Kiswahili']
];
const trCache = new Map();        // key: lang + '\u0000' + text
let trPending = false;

function trKey(lang, text) { return lang + '\u0000' + text; }

async function trOne(text, lang) {
    const endpoints = [
        () => 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
              lang + '&dt=t&q=' + encodeURIComponent(text),
        () => 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
              '&langpair=autodetect|' + lang
    ];
    for (let i = 0; i < endpoints.length; i++) {
        try {
            const res = await fetch(endpoints[i]());
            if (!res.ok) continue;
            const data = await res.json();
            if (i === 0 && Array.isArray(data) && Array.isArray(data[0])) {
                const out = data[0].map(seg => (seg && seg[0]) || '').join('');
                if (out.trim()) return out;
            }
            if (i === 1 && data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) { /* try the next one */ }
    }
    return null;
}

async function trFill(items, lang, onDone) {
    // only what is on screen, and only what is not already cached
    const wanted = [];
    items.forEach(i => {
        [i.title, i.snippet].forEach(t => {
            if (t && !trCache.has(trKey(lang, t))) wanted.push(t);
        });
    });
    if (!wanted.length) { onDone(false); return; }

    trPending = true;
    let changed = false;
    const queue = wanted.slice(0, 120);
    async function worker() {
        while (queue.length) {
            const text = queue.shift();
            const out = await trOne(text, lang);
            trCache.set(trKey(lang, text), out || text);   // fall back to the original
            changed = true;
        }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    trPending = false;
    onDone(changed);
}

function trText(text, lang) {
    if (!text || lang === 'off') return text;
    const hit = trCache.get(trKey(lang, text));
    return hit === undefined ? text : hit;
}

/* the article itself, translated, as a plain link */
function trUrl(url, lang) {
    try {
        const u = new URL(url);
        return 'https://translate.google.com/translate?sl=auto&tl=' + lang +
               '&u=' + encodeURIComponent(u.href);
    } catch (e) { return url; }
}

const state = { tl: 'off', items: [], topics: [], languages: {}, sources: [], generated: null,
                geo: [], standings: [], docScore: 3, topic: 'all', standing: 'all', place: 'all', sub: 'all', spot: 'all',
                langs: new Set(), when: 'all', evidence: 'all', query: '', shown: 50, loading: false };

const $list = document.getElementById('fdList');
const $status = document.getElementById('fdStatus');
const $dot = document.getElementById('fdDot');
const $prog = document.getElementById('fdProgress');
const $topicRow = document.getElementById('fdTopicRow');
const $standingRow = document.getElementById('fdRegionRow');
const $evidenceRow = document.getElementById('fdEvidenceRow');
const $geoRow = document.getElementById('fdGeoRow');
const $subRow = document.getElementById('fdSubRow');
const $placeRow = document.getElementById('fdPlaceRow');
const $langRow = document.getElementById('fdLangRow');
const $whenRow = document.getElementById('fdWhenRow');
const $search = document.getElementById('fdSearch');
const $srcGrid = document.getElementById('fdSrcGrid');
const $refresh = document.getElementById('fdRefresh');
const $more = document.createElement('button');
$more.className = 'fd-more';
$more.addEventListener('click', () => { state.shown += 50; render(); });

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function timeAgo(ts) {
    if (!ts) return 'undated';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.round(h / 24);
    return d < 30 ? d + 'd ago' : new Date(ts).toISOString().slice(0, 10);
}
function langName(c) { return state.languages[c] || c; }
function placeLabel(item) {
    // name the most specific thing known: the place, else the subregion, else the region
    const spots = (item.spots || []).filter(p => p !== 'unlocated');
    const subs = (item.subs || []).filter(p => p !== 'unlocated');
    const regs = (item.places || []).filter(p => p !== 'unlocated');
    const lookup = (id) => {
        for (const r of state.geo) {
            if (r.id === id) return r.label;
            for (const sb of (r.subs || [])) {
                if (sb.id === id) return sb.label;
                for (const pl of (sb.places || [])) if (pl.id === id) return pl.label;
            }
        }
        return id;
    };
    const pick = spots.length ? spots : (subs.length ? subs : regs);
    if (!pick.length) return 'unplaced';
    return pick.slice(0, 2).map(lookup).join(' · ');
}
function topicLabel(id) { const t = state.topics.find(t => t.id === id); return t ? t.label : id; }
let lastStatus = '';
function refreshStatus() { if (lastStatus) $status.textContent = lastStatus; }
function setStatus(text, cls) { $status.textContent = text;
    if (text.indexOf('Translating') === -1) lastStatus = text; $dot.className = 'fd-dot' + (cls ? ' ' + cls : ''); }

async function load() {
    if (state.loading) return;
    state.loading = true; $refresh.disabled = true; $prog.style.width = '40%';
    setStatus('Loading the wire…', '');

    // Take the first endpoint that returns stories. An endpoint that answers
    // with an empty wire is remembered but not accepted while others remain to
    // try: a stale mirror serving the pre-harvest seed parses perfectly well,
    // and silently rendering it as "no stories" hides a feed that is running.
    let data = null, empty = null, err = null;
    for (const ep of ENDPOINTS) {
        try {
            const res = await fetch(ep(), { cache: 'no-store' });
            if (!res.ok) { err = 'HTTP ' + res.status; continue; }
            const body = await res.json();
            if (!Array.isArray(body.items)) { err = 'unexpected shape'; continue; }
            if (body.items.length) { data = body; break; }
            if (!empty || (body.generated || '') > (empty.generated || '')) empty = body;
        } catch (e) { err = e.message; }
    }
    if (!data && empty) data = empty;
    $prog.style.width = '100%';

    // An empty wire is not a normal state once the harvester has run, so say so
    // rather than printing a tidy row of zeroes that looks like a quiet day.
    if (data && Array.isArray(data.items) && data.items.length === 0) {
        state.loading = false; $refresh.disabled = false; $prog.style.width = '0';
        render();
        setStatus('The wire is empty. Either the harvester has not run yet, or a mirror '
                  + 'served a copy from before it did — press Refresh in a minute.', 'error');
        return;
    }

    if (!data || !Array.isArray(data.items)) {
        state.loading = false; $refresh.disabled = false; $prog.style.width = '0';
        setStatus('The wire could not be read' + (err ? ' (' + err + ')' : '') + '. Press Refresh.', 'error');
        render(); return;
    }

    state.items = data.items.map(i => ({
        title: i.t, link: i.u, outlet: i.o, lang: i.g, region: i.r,
        kind: i.k, ts: i.d, snippet: i.s, topics: i.x || [],
        score: i.p || 0,
        ll: (i.ll && i.ll.length === 2) ? i.ll : null, pin: i.pn || null, pa: !!i.pa, why: i.y || [], places: i.w || ['unlocated'], subs: i.sr || ['unlocated'], spots: i.pl || ['unlocated'],
        standing: i.st || 'press'
    }));
    state.docScore = data.notable_score || 3;
    state.standings = data.standings || [];
    state.topics = data.topics || [];
    state.languages = data.languages || {};
    state.geo = data.geo || [];
    state.sources = data.sources || [];
    state.generated = data.generated ? Date.parse(data.generated) : null;

    buildChips(); renderSources();

    const c = data.counts || {};
    const ageH = state.generated ? (Date.now() - state.generated) / 3600000 : null;
    const docd = state.items.filter(i => i.score >= state.docScore).length;
    setStatus(
        (c.stories || state.items.length) + ' stories · ' + docd + ' notable · ' +
        (c.refused ? c.refused + ' refused · ' : '') +
        (c.languages || new Set(state.items.map(i => i.lang)).size) + ' languages · ' +
        (c.wires_ok || '?') + '/' + (c.wires_total || '?') + ' wires answered · harvested ' +
        (state.generated ? timeAgo(state.generated) : 'unknown'),
        ageH !== null && ageH > 6 ? 'idle' : ''
    );

    state.loading = false; $refresh.disabled = false;
    setTimeout(() => { $prog.style.width = '0'; }, 400);
    render();
}

function withinWindow(i, win) {
    const w = WINDOWS.find(w => w.id === (win || state.when));
    if (!w || !w.ms) return true;
    if (!i.ts) return false;
    const age = Date.now() - i.ts;
    return w.older ? age > w.ms : age <= w.ms;
}

function visible() {
    const q = state.query.toLowerCase();
    return state.items.filter(i => {
        if (state.topic !== 'all' && i.topics.indexOf(state.topic) === -1) return false;
        if (state.standing !== 'all' && i.standing !== state.standing) return false;
        if (state.evidence === 'doc' && i.score < state.docScore) return false;
        if (state.place !== 'all' && i.places.indexOf(state.place) === -1) return false;
        if (state.sub !== 'all' && i.subs.indexOf(state.sub) === -1) return false;
        if (state.spot !== 'all' && i.spots.indexOf(state.spot) === -1) return false;
        if (state.langs.size && !state.langs.has(i.lang)) return false;
        if (!withinWindow(i)) return false;
        if (q && (i.title + ' ' + i.snippet + ' ' + i.outlet).toLowerCase().indexOf(q) === -1) return false;
        return true;
    }).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

function render() {
    const items = visible(), slice = items.slice(0, state.shown);
    if (!slice.length) {
        $list.innerHTML = '<div class="fd-state">' + (
            state.loading ? 'Loading the wire…'
            : state.items.length ? '<strong>Nothing matches these filters.</strong><br>Widen the window, the subject or the language.'
            : '<strong>No stories loaded.</strong><br>Press Refresh, or check that the harvester has run.'
        ) + '</div>';
    } else {
        $list.innerHTML = slice.map(i => {
            const tags = i.topics.map(id => {
                const c = TOPIC_COLOR[id] || '#9fb0c8';
                return '<span class="fd-t" style="color:' + c + ';border-color:' + c + '55">' + esc(topicLabel(id)) + '</span>';
            }).join('');
            const documented = i.score >= state.docScore;
            const sc = STANDING_COLOR[i.standing] || '#9fb0c8';
            const stLabel = (state.standings.find(s => s.id === i.standing) || {}).label || i.standing;
            const pips = '<span class="fd-scale" title="significance score ' + i.score + '">' +
                [1,2,3,4,5].map(n => '<span class="fd-pip' + (n <= Math.min(i.score,5) ? ' on' : '') + '"></span>').join('') +
                '</span>';
            return '<a class="fd-item' + (documented ? ' watch' : '') + '" href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer">' +
                '<div class="fd-meta"><span class="fd-lang">' + esc(langName(i.lang)) + '</span>' +
                '<span class="fd-standing" style="color:' + sc + ';border-color:' + sc + '55">' + esc(stLabel) + '</span>' +
                '<span>' + esc(i.outlet) + '</span>' +
                '<span>' + esc(placeLabel(i)) + '</span>' +
                pips + (i.why.length ? '<span class="fd-why">' + esc(i.why.join(' · ')) + '</span>' : '') +
                '<span>' + timeAgo(i.ts) + '</span>' +
                (state.tl !== 'off' ? '<span class="fd-mt">machine translation</span>' : '') +
                '</div>' +
                '<div class="fd-item-title"' + (state.tl !== 'off' ? ' title="' + esc(i.title) + '"' : '') + '>' + esc(trText(i.title, state.tl)) + '</div>' +
                (i.snippet ? '<div class="fd-snip">' + esc(trText(i.snippet, state.tl)) + '</div>' : '') +
                '<div class="fd-tags">' + tags + '</div></a>';
        }).join('');
        if (items.length > state.shown) {
            $more.textContent = 'Show more (' + (items.length - state.shown) + ' remaining)';
            $list.appendChild($more);
        }
    }
    chipCounts();
    renderMap(items);
}

function chip(row, key, value, label, color) {
    const c = document.createElement('button');
    c.className = 'fd-chip';
    c.dataset[key] = value;
    if (color) c.style.setProperty('--chipcolor', color);
    c.innerHTML = esc(label) + ' <span class="fd-n"></span>';
    row.appendChild(c);
    return c;
}

function buildChips() {
    [$topicRow, $geoRow, $standingRow, $evidenceRow, $langRow, $whenRow].forEach(r => r.querySelectorAll('.fd-chip').forEach(c => c.remove()));

    chip($topicRow, 'topic', 'all', 'All').classList.add('on');
    state.topics.forEach(t => chip($topicRow, 'topic', t.id, t.label, TOPIC_COLOR[t.id]));

    chip($geoRow, 'place', 'all', 'Everywhere').classList.add('on');
    state.geo.forEach(g => {
        const c = chip($geoRow, 'place', g.id, g.label);
        if (g.id === state.place) c.classList.add('on');
    });
    buildDrilldown();

    chip($standingRow, 'standing', 'all', 'All').classList.add('on');
    state.standings.forEach(st => {
        const c = chip($standingRow, 'standing', st.id, st.label);
        c.style.setProperty('--chipcolor', STANDING_COLOR[st.id] || '#e8eef7');
        if (st.id === state.standing) c.classList.add('on');
    });

    EVIDENCE.forEach(e => {
        const c = chip($evidenceRow, 'evidence', e.id, e.label);
        if (e.id === state.evidence) c.classList.add('on');
    });

    // an explicit All chip: without one the only way back from a single
    // language was to untick it again
    const allLang = chip($langRow, 'lang', 'all', 'All languages');
    if (!state.langs.size) allLang.classList.add('on');
    Object.keys(state.languages).sort((a, b) => langName(a).localeCompare(langName(b)))
        .forEach(code => chip($langRow, 'lang', code, langName(code)));

    WINDOWS.forEach(w => {
        const c = chip($whenRow, 'when', w.id, w.label);
        if (w.id === state.when) c.classList.add('on');
    });

}

function buildDrilldown() {
    [$subRow, $placeRow].forEach(r => r.querySelectorAll('.fd-chip').forEach(c => c.remove()));
    const region = state.geo.find(g => g.id === state.place);
    if (!region || !region.subs || !region.subs.length) {
        $subRow.style.display = 'none';
        $placeRow.style.display = 'none';
        state.sub = 'all'; state.spot = 'all';
        return;
    }
    $subRow.style.display = '';
    const allSub = chip($subRow, 'sub', 'all', 'All of ' + region.label);
    if (state.sub === 'all') allSub.classList.add('on');
    region.subs.forEach(sb => {
        const c = chip($subRow, 'sub', sb.id, sb.label);
        if (sb.id === state.sub) c.classList.add('on');
    });

    const sub = region.subs.find(sb => sb.id === state.sub);
    if (!sub || !sub.places || !sub.places.length) {
        $placeRow.style.display = 'none';
        state.spot = 'all';
        return;
    }
    $placeRow.style.display = '';
    const allSpot = chip($placeRow, 'spot', 'all', 'All of ' + sub.label);
    if (state.spot === 'all') allSpot.classList.add('on');
    sub.places.forEach(pl => {
        const c = chip($placeRow, 'spot', pl.id, pl.label);
        if (pl.id === state.spot) c.classList.add('on');
    });
}

function chipCounts() {
    const q = state.query.toLowerCase();
    const base = state.items.filter(i =>
        (!q || (i.title + ' ' + i.snippet).toLowerCase().indexOf(q) !== -1) && withinWindow(i));
    $topicRow.querySelectorAll('.fd-chip').forEach(c => {
        const id = c.dataset.topic;
        const n = id === 'all' ? base.length : base.filter(i => i.topics.indexOf(id) !== -1).length;
        c.querySelector('.fd-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $subRow.querySelectorAll('.fd-chip').forEach(c => {
        const id = c.dataset.sub;
        const n = id === 'all'
            ? base.filter(i => state.place === 'all' || i.places.indexOf(state.place) !== -1).length
            : base.filter(i => i.subs.indexOf(id) !== -1).length;
        c.querySelector('.fd-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $placeRow.querySelectorAll('.fd-chip').forEach(c => {
        const id = c.dataset.spot;
        const n = id === 'all'
            ? base.filter(i => state.sub === 'all' || i.subs.indexOf(state.sub) !== -1).length
            : base.filter(i => i.spots.indexOf(id) !== -1).length;
        c.querySelector('.fd-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $geoRow.querySelectorAll('.fd-chip').forEach(c => {
        const g = c.dataset.place;
        const n = g === 'all' ? base.length : base.filter(i => i.places.indexOf(g) !== -1).length;
        c.querySelector('.fd-n').textContent = n;
        c.classList.toggle('empty', n === 0 && g !== 'all');
    });
    $standingRow.querySelectorAll('.fd-chip').forEach(c => {
        const r = c.dataset.standing;
        const n = r === 'all' ? base.length : base.filter(i => i.standing === r).length;
        c.querySelector('.fd-n').textContent = n;
        c.classList.toggle('empty', n === 0 && r !== 'all');
    });
    $evidenceRow.querySelectorAll('.fd-chip').forEach(c => {
        const id = c.dataset.evidence;
        c.querySelector('.fd-n').textContent =
            id === 'doc' ? base.filter(i => i.score >= state.docScore).length : base.length;
    });
    $langRow.querySelectorAll('.fd-chip').forEach(c => {
        const code = c.dataset.lang;
        const n = code === 'all' ? base.length : base.filter(i => i.lang === code).length;
        c.querySelector('.fd-n').textContent = n;
        c.classList.toggle('empty', n === 0 && code !== 'all');
    });
    $whenRow.querySelectorAll('.fd-chip').forEach(c => {
        const n = state.items.filter(i => withinWindow(i, c.dataset.when)).length;
        c.querySelector('.fd-n').textContent = n;
        // the archive chip only appears once there is an archive
        if (c.dataset.when === 'older') c.style.display = n ? '' : 'none';
    });
}

function renderSources() {
    $srcGrid.innerHTML = state.sources.map(s =>
        '<div class="fd-src ' + (s.ok ? '' : 'fail') + '"><span>' + esc(s.name) + '</span>' +
        '<span>' + (s.ok ? s.kept + ' kept' + (s.refused ? ' · ' + s.refused + ' refused' : '') : 'unreachable') +
        '</span></div>').join('');
}

/* ---- Wiring ---- */
function single(row, key) {
    row.addEventListener('click', e => {
        const c = e.target.closest('.fd-chip'); if (!c) return;
        state[key] = c.dataset[key]; state.shown = 50;
        row.querySelectorAll('.fd-chip').forEach(x => x.classList.toggle('on', x === c));
        render();
    });
}
single($topicRow, 'topic');
single($standingRow, 'standing');
single($evidenceRow, 'evidence');
$geoRow.addEventListener('click', e => {
    const c = e.target.closest('.fd-chip'); if (!c) return;
    state.place = c.dataset.place; state.sub = 'all'; state.spot = 'all'; state.shown = 50;
    $geoRow.querySelectorAll('.fd-chip').forEach(x => x.classList.toggle('on', x === c));
    buildDrilldown(); render(); fitToSelection();
});
$subRow.addEventListener('click', e => {
    const c = e.target.closest('.fd-chip'); if (!c) return;
    state.sub = c.dataset.sub; state.spot = 'all'; state.shown = 50;
    buildDrilldown(); render(); fitToSelection();
});
$placeRow.addEventListener('click', e => {
    const c = e.target.closest('.fd-chip'); if (!c) return;
    state.spot = c.dataset.spot; state.shown = 50;
    $placeRow.querySelectorAll('.fd-chip').forEach(x => x.classList.toggle('on', x === c));
    render();
});
single($whenRow, 'when');

$langRow.addEventListener('click', e => {
    const c = e.target.closest('.fd-chip'); if (!c) return;
    const code = c.dataset.lang;
    if (code === 'all') {
        state.langs.clear();
    } else if (state.langs.has(code)) {
        state.langs.delete(code);
    } else {
        state.langs.add(code);
    }
    // All is lit exactly when no single language is picked
    $langRow.querySelectorAll('.fd-chip').forEach(x => x.classList.toggle('on',
        x.dataset.lang === 'all' ? !state.langs.size : state.langs.has(x.dataset.lang)));
    state.shown = 50; render();
});

$refresh.addEventListener('click', load);
document.getElementById('fdClear').addEventListener('click', () => {
    state.topic = 'all'; state.standing = 'all'; state.evidence = 'all'; state.place = 'all'; state.sub = 'all'; state.spot = 'all';
    state.langs.clear(); state.when = 'all';
    state.query = ''; state.shown = 50; $search.value = '';
    $topicRow.querySelectorAll('.fd-chip').forEach(c => c.classList.toggle('on', c.dataset.topic === 'all'));
    $standingRow.querySelectorAll('.fd-chip').forEach(c => c.classList.toggle('on', c.dataset.standing === 'all'));
    $evidenceRow.querySelectorAll('.fd-chip').forEach(c => c.classList.toggle('on', c.dataset.evidence === 'all'));
    $geoRow.querySelectorAll('.fd-chip').forEach(c => c.classList.toggle('on', c.dataset.place === 'all'));
    buildDrilldown();
    $langRow.querySelectorAll('.fd-chip').forEach(c => c.classList.toggle('on', c.dataset.lang === 'all'));
    $whenRow.querySelectorAll('.fd-chip').forEach(c => c.classList.toggle('on', c.dataset.when === 'all'));
    render();
});
let timer;
$search.addEventListener('input', e => {
    clearTimeout(timer); const v = e.target.value;
    timer = setTimeout(() => { state.query = v; state.shown = 50; render(); }, 180);
});

document.querySelectorAll('.fd-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        const sheet = document.getElementById(tab.dataset.sheet);
        const opening = !sheet.classList.contains('open');
        document.querySelectorAll('.fd-sheet').forEach(s => s.classList.remove('open'));
        document.querySelectorAll('.fd-tab').forEach(t => t.classList.remove('on'));
        if (opening) { sheet.classList.add('open'); tab.classList.add('on'); }
    });
});
document.querySelectorAll('.fd-sheet [data-close]').forEach(b => {
    b.addEventListener('click', () => {
        b.closest('.fd-sheet').classList.remove('open');
        document.querySelectorAll('.fd-tab').forEach(t => t.classList.remove('on'));
    });
});
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.fd-sheet').forEach(s => s.classList.remove('open'));
    document.querySelectorAll('.fd-tab').forEach(t => t.classList.remove('on'));
});


/* translation control */
(function () {
    const sel = document.getElementById('fdTr');
    if (!sel) return;
    TR_LANGS.forEach(pair => {
        const o = document.createElement('option');
        o.value = pair[0]; o.textContent = pair[1];
        sel.appendChild(o);
    });
    sel.value = 'off';
    sel.addEventListener('change', () => {
        state.tl = sel.value;
        state.shown = 50;
        render();
        if (state.tl === 'off') { refreshStatus(); return; }
        const onscreen = visible().slice(0, state.shown);
        setStatus('Translating ' + onscreen.length + ' headlines…', '');
        trFill(onscreen, state.tl, () => { render(); refreshStatus(); });
    });
})();

load();
setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);

let satFills = [], satParts = [];
const SAT = {
    sat: 1.15,    // above 1, so surfaces stay different from each other
    con: 1.05,
    bright: 1.06,
    hue: -6,      // degrees, warms the greens off satellite's blue-green
    green: 0.30,  // soft-light green over land: tints without flattening
    warm: 0.22,   // overlay gold: the sunlit look
    sea: 0.55,
    shade: 0.45   // relief: the sculpted part
};
const FAN_STEP = 8.5;
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
const FAN_ZOOM_FLOOR = 5;

function initMap() {
    if (fdMap || typeof L === 'undefined' || mapBroken) return;
    const el = document.getElementById('fdMap');
    if (!el) return;
    fdMap = L.map(el, { worldCopyJump: true, zoomControl: true, attributionControl: true })
             .setView([20, 10], 1);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16,
        noWrap: true,
        bounds: [[-85.05, -180], [85.05, 180]],
        updateWhenZooming: false,
        keepBuffer: 2,
        attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
    }).addTo(fdMap);
    fdLayer = L.layerGroup().addTo(fdMap);
    dressSatellite();
    setTimeout(() => fdMap.invalidateSize(), 60);
    window.addEventListener('resize', () => fdMap.invalidateSize());
}

function dressSatellite() {
    if (!fdMap || typeof L === 'undefined') return;
    try {
        const pane = (name, z, blend) => {
            if (!fdMap.getPane(name)) fdMap.createPane(name);
            const el = fdMap.getPane(name);
            el.style.zIndex = z;
            el.style.pointerEvents = 'none';
            if (blend) el.style.mixBlendMode = blend;
            return el;
        };
        const fillPane = (name, z, blend, colour, opacity) => {
            const el = pane(name, z, blend);
            const d = document.createElement('div');
            d.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;background:' +
                              colour + ';opacity:' + opacity + ';';
            el.appendChild(d);
            satFills.push(d);
            satParts.push(el);
            return { el: el, fill: d };
        };

        // the imagery's own filter
        const sp = fdMap.getPane('tilePane');
        if (sp) sp.style.filter = 'saturate(' + SAT.sat + ') contrast(' + SAT.con +
            ') brightness(' + SAT.bright + ') hue-rotate(' + SAT.hue + 'deg)';

        // water first, under the land washes, so the sea is softened by them
        const seaL = fillPane('satSea', 205, 'screen', '#0f3b52', SAT.sea);
        // soft-light rather than color: it shifts hue in proportion to how light
        // a pixel already is, so ploughland goes green and dark rock stays dark
        const greenL = fillPane('satWash', 210, 'soft-light', '#5f8f3a', SAT.green);
        // overlay lifts highlights and deepens shadows at once — most of what
        // makes a map read as lit rather than scanned
        const warmL = fillPane('satWarm', 214, 'overlay', '#f0c073', SAT.warm);

        const shadeEl = pane('satShade', 220, 'multiply');
        satParts.push(shadeEl);
        const shade = L.tileLayer(
            'https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',
            { pane: 'satShade', opacity: SAT.shade, maxZoom: 16, maxNativeZoom: 16,
              noWrap: true, bounds: [[-85.05, -180], [85.05, 180]],
              updateWhenZooming: false, keepBuffer: 2, attribution: 'Hillshade © Esri' });

        // a layer that cannot load is dropped rather than left half-drawn
        const guard = (layer, name, onGone) => {
            let n = 0;
            layer.on('tileerror', () => {
                if (++n === 12) {
                    try { fdMap.removeLayer(layer); } catch (e) { /* already gone */ }
                    try { onGone && onGone(); } catch (e) { /* nothing to undo */ }
                    console.warn('map: ' + name + ' failed repeatedly; dropped');
                }
            });
            layer.addTo(fdMap);
        };
        guard(shade, 'hillshade', () => {
            // without relief the washes are just a colour cast on a photograph
            greenL.el.style.display = 'none';
            warmL.el.style.display = 'none';
            if (sp) sp.style.filter = '';
        });

        /* The painted plate. Below the fade window the map reads as a drawn
           chart; zoom past it and the plate cross-fades away to the imagery
           underneath. Purely decorative — interactive:false, so it never
           intercepts a click on a pin.
         *
         * The southern edge is the version from the social-spheres map. The
         * art here previously ended on a ruled horizontal line a little below
         * the compass rose: opaque ocean, hard seam, then nothing. The paint
         * below that line was still in the file — only its mask had been cut
         * square — so this carries the social-spheres alpha envelope across
         * the same rows, and the chart now thins out through the forties
         * instead of stopping at a straight edge. The title plaque keeps its
         * own mask, or it would take the other map's lettering with it. */
        const plateEl = pane('plate', 250);
        satParts.push(plateEl);
        const PLATE_S = -80.55, PLATE_N = 85.05112877980659;
        const PLATE_FADE_IN = 3, PLATE_FADE_OUT = 5.6;
        let plate = null;
        try {
            plate = PLATE_IMG && L.imageOverlay(PLATE_IMG, [[PLATE_S, -180], [PLATE_N, 180]],
                { pane: 'plate', interactive: false }).addTo(fdMap);
        } catch (e) { console.warn('map: plate overlay unavailable:', e); }
        const blendPlate = () => {
            if (!plate) return;
            try {
                const z = fdMap.getZoom();
                const t = Math.max(0, Math.min(1, (z - PLATE_FADE_IN) / (PLATE_FADE_OUT - PLATE_FADE_IN)));
                const op = 1 - t;
                if (op <= 0.001) { if (fdMap.hasLayer(plate)) fdMap.removeLayer(plate); }
                else { if (!fdMap.hasLayer(plate)) plate.addTo(fdMap); plate.setOpacity(op); }
                el.classList.toggle('plated', op > 0.02);
            } catch (e) { /* not ready yet */ }
        };
        // zoomanim fires while the zoom is animating, so the plate dissolves
        // through the gesture rather than stepping at the end of it
        fdMap.on('zoomend zoomanim', blendPlate);
        fdMap.on('zoomend', resizePins);
        fdMap.whenReady(blendPlate);
        blendPlate();

        // A flat fill inside a Leaflet pane is nailed to the map, not the screen:
        // pan far enough and its edge crosses the view as a hard line. These
        // carry no geography, so they follow the screen instead — repositioned
        // against the map pane's own offset on every move.
        const cover = () => {
            try {
                const mp = fdMap.getPanes().mapPane;
                const o = L.DomUtil.getPosition(mp) || { x: 0, y: 0 };
                const sz = fdMap.getSize();
                const m = 400;
                satFills.forEach(d => {
                    d.style.left = (-o.x - m) + 'px';
                    d.style.top = (-o.y - m) + 'px';
                    d.style.width = (sz.x + m * 2) + 'px';
                    d.style.height = (sz.y + m * 2) + 'px';
                });
            } catch (e) { /* mid-gesture, next move fixes it */ }
        };

        // Tints ease off as you zoom in: wide out they do the work, close in
        // they cover the detail somebody zoomed in to see. Relief does the
        // reverse — it is wanted more at valley scale.
        const ramp = () => {
            try {
                const z = fdMap.getZoom();
                const t = z <= 6 ? 1 : z >= 13 ? 0.45 : 1 - (z - 6) * (0.55 / 7);
                greenL.fill.style.opacity = SAT.green * t;
                warmL.fill.style.opacity = SAT.warm * t;
                seaL.fill.style.opacity = SAT.sea * (z <= 6 ? 1 : 0.7);
                shade.setOpacity(z <= 4 ? SAT.shade * 0.8 : SAT.shade);
            } catch (e) { /* not ready yet */ }
        };
        fdMap.on('zoomend', ramp);
        fdMap.on('move zoom zoomend moveend resize viewreset', cover);
        fdMap.whenReady(() => { ramp(); cover(); });
        ramp(); cover();
    } catch (err) {
        console.warn('map: satellite treatment skipped:', err);
    }
}

function renderMap(items) {
    try { renderMapInner(items); }
    catch (err) {
        // a broken map is a missing panel, never a missing feed
        mapBroken = true;
        const wrap = document.getElementById('fdMapWrap');
        if (wrap) wrap.style.display = 'none';
        console.warn('map disabled:', err);
    }
}

function renderMapInner(items) {
    if (typeof L === 'undefined' || mapBroken) {
        const wrap = document.getElementById('fdMapWrap');
        if (wrap) wrap.style.display = 'none';
        return;
    }
    initMap();
    if (!fdMap || !fdLayer) return;
    fdLayer.clearLayers();
    fdPins = [];

    // Every story gets its own pin. Stories resolving to the same place would
    // otherwise sit on top of each other, so each is nudged onto a ring around
    // the point — deterministic, so a pin does not move between renders.
    const seenAt = new Map();
    let mapped = 0, unplaced = 0, approx = 0;

    items.forEach(i => {
        if (!i.ll || i.ll.length !== 2) { unplaced++; return; }
        mapped++;
        if (i.pa) approx++;
        const key = i.ll[0] + ',' + i.ll[1];
        const n = seenAt.get(key) || 0;
        seenAt.set(key, n + 1);

        /* Where a story sits when others share its coordinate — see fanOffset. */
        const off = n > 0 ? fanOffset(n, i.link) : { dx: 0, dy: 0 };

        const entry = { item: i, at: i.ll.slice(), base: key, dx: off.dx, dy: off.dy,
                        colour: TOPIC_COLOR[i.topics[0]] || '#a49f98',
                        full: i.score >= state.docScore ? 13 : 10,
                        approx: !!i.pa,
                        dim: n > 0 ? 0.92 : 1 };
        entry.at = fanned(entry);
        const marker = L.marker(entry.at, { icon: pinIcon(entry), title: i.title }).addTo(fdLayer);
        entry.marker = marker;
        fdPins.push(entry);
        marker.on('click', () => openPinPopup(entry));
    });

    const c = document.getElementById('fdMapCount');
    const u = document.getElementById('fdMapUnplaced');
    if (c) c.textContent = mapped + (mapped === 1 ? ' story mapped' : ' stories mapped') +
        (approx ? ' \u00b7 ' + approx + ' by source country' : '');
    if (u) u.textContent = unplaced ? unplaced + ' unplaced' : '';
    state.mapped = mapped;
    state.unplaced = unplaced;
}

function pointsUnder(regionId, subId, spotId) {
    const co = state.coords || {};
    const out = [];
    const push = (id) => { if (co[id]) out.push(co[id]); };
    if (spotId && spotId !== 'all') { push(spotId); return out; }
    (state.geo || []).forEach(r => {
        if (regionId !== 'all' && r.id !== regionId) return;
        (r.subs || []).forEach(sb => {
            if (subId && subId !== 'all' && sb.id !== subId) return;
            (sb.places || []).forEach(pl => push(pl.id));
            if (!(sb.places || []).length) push(sb.id);
        });
        // the region's own centroid only if nothing beneath it was placeable,
        // otherwise it drags the frame away from the places it contains
        if (!out.length) push(r.id);
    });
    return out;
}

function fitToSelection() {
    if (!fdMap || mapBroken || typeof L === 'undefined') return;
    try {
        if (state.place === 'all') {
            fdMap.setView([20, 10], 1);
            return;
        }
        const pts = pointsUnder(state.place, state.sub, state.spot);
        if (!pts.length) return;
        if (pts.length === 1) {
            fdMap.setView(pts[0], state.spot !== 'all' ? 6 : 4);
            return;
        }
        fdMap.fitBounds(L.latLngBounds(pts), { padding: [24, 24], maxZoom: 7, animate: true });
    } catch (err) {
        console.warn('map could not frame the selection:', err);
    }
}

function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 4294967296;        // 0…1, stable for a given link
}

function fanOffset(n, link) {
    const j = hashSeed(link || String(n));
    const angle = n * GOLDEN_ANGLE + (j - 0.5) * 0.7;
    const r = FAN_STEP * Math.sqrt(n) * (0.85 + j * 0.3);
    return { dx: Math.cos(angle) * r, dy: Math.sin(angle) * r };
}

function fanned(entry) {
    if (!entry.dx && !entry.dy) return entry.item.ll;
    let z = FAN_ZOOM_FLOOR;
    try { z = Math.max(FAN_ZOOM_FLOOR, fdMap.getZoom()); } catch (e) { /* not ready */ }
    const unit = 360 / (256 * Math.pow(2, z));
    const lat = entry.item.ll[0], lon = entry.item.ll[1];
    const cos = Math.max(0.2, Math.cos(lat * Math.PI / 180));
    return [lat + entry.dy * unit * cos, lon + entry.dx * unit];
}

function pinScale() {
    let z = 3;
    try { z = fdMap.getZoom(); } catch (e) { /* not ready; assume mid */ }
    if (z <= 1) return 0.52;
    if (z >= 6) return 1;
    return 0.52 + (z - 1) * (0.48 / 5);
}

function pinIcon(entry) {
    const size = Math.max(5, Math.round(entry.full * pinScale()));
    const thin = size < 9 ? ' fd-pin-sm' : '';
    return L.divIcon({
        className: '',
        html: '<div class="fd-pin' + thin + (entry.approx ? ' fd-pin-approx' : '') + '" style="width:' + size + 'px;height:' + size +
              'px;background:' + entry.colour + ';color:' + entry.colour + ';opacity:' + entry.dim + ';"></div>',
        iconSize: [size, size], iconAnchor: [size / 2, size / 2]
    });
}

function resizePins() {
    try {
        fdPins.forEach(e => {
            e.marker.setIcon(pinIcon(e));
            if (e.dx || e.dy) {
                e.at = fanned(e);
                e.marker.setLatLng(e.at);
            }
        });
    } catch (err) { /* mid-render */ }
}

function neighboursOf(entry) {
    const group = [entry];
    if (!fdMap) return group;
    let here;
    try { here = fdMap.latLngToContainerPoint(entry.at); }
    catch (e) { return group; }
    fdPins.forEach(other => {
        if (other === entry) return;
        if (other.base === entry.base) { group.push(other); return; }   // same place, always
        try {
            const p = fdMap.latLngToContainerPoint(other.at);
            const dx = p.x - here.x, dy = p.y - here.y;
            if (Math.sqrt(dx * dx + dy * dy) <= PIN_NEIGHBOUR_PX) group.push(other);
        } catch (e) { /* ignore an unplottable neighbour */ }
    });
    return group;
}

function openPinPopup(entry) {
    if (!fdMap) return;
    const group = neighboursOf(entry);
    const places = [];
    group.forEach(g => {
        const nm = placeLabel(g.item);
        if (places.indexOf(nm) === -1) places.push(nm);
    });
    const head = '<div class="fd-pop-place">' + esc(places.slice(0, 3).join(' · ')) +
                 (group.length > 1 ? ' · ' + group.length + ' stories here' : '') + '</div>';
    const rows = group.slice(0, 20).map((g, n) =>
        '<a href="' + esc(g.item.link) + '" target="_blank" rel="noopener noreferrer"' +
        (n === 0 && group.length > 1 ? ' class="fd-pop-first"' : '') + '>' +
        esc(trText(g.item.title, state.tl)) +
        '<span class="fd-pop-src">' + esc(g.item.source) +
        (places.length > 1 ? ' · ' + esc(placeLabel(g.item)) : '') + '</span></a>').join('');
    const more = group.length > 20 ? '<div class="fd-pop-place">and ' + (group.length - 20) + ' more</div>' : '';
    L.popup({ maxWidth: 300, autoPan: true })
     .setLatLng(entry.at)
     .setContent(head + rows + more)
     .openOn(fdMap);
}

})();
